---
# Debian and Alpine base images with the iSimcha CLI tools and secret scanners.
# Tool sources: iSimcha/devcontainer-features (dev-shell packages.json, dev-tools, check-secrets.yml)
# and iSimcha/common (.scripts/packages.json, common.just).

debian:
  # https://hub.docker.com/_/debian
  image: docker.io/library/debian
  tag: "13-slim"
  version: "13"

alpine:
  # https://hub.docker.com/_/alpine
  image: docker.io/library/alpine
  tag: "3.24"
  version: "3.24"

published:
  # Tag: <version>-<distro>-<distro version>, e.g. v1.0.0-alpine-3.24. Bump when any layer changes.
  version: v1.0.0
  debian:
    name: debian-base
  alpine:
    name: alpine-base

# Nushell runs setup.nu, so the Dockerfile installs it before anything else. The static musl
# build runs on both distros. Every nu_plugin_* in the archive is installed alongside it.
nushell:
  version: "0.112.2"
  filename: nu-0.112.2-x86_64-unknown-linux-musl.tar.gz
  # From the release's SHA256SUMS.
  sha256: d9c0ba0938beed6148c8a354c45612c0979d7a787794b8dd13e866ca3b571375

# OS packages. tar, xz and unzip unpack the release archives below.
packages:
  debian:
    - bash
    - ca-certificates
    - curl
    - git
    - jq
    - openssh-client
    - sudo
    - tar
    - unzip
    - xz-utils
  alpine:
    - bash
    - ca-certificates
    - curl
    - git
    - jq
    - openssh-client
    - sudo
    - tar
    - unzip
    - xz
    # useradd, matching Debian; busybox only has adduser.
    - shadow
    # Node 24 LTS. Debian 13 ships Node 20, too old for cspell and claude-code (both need >= 22).
    - nodejs
    - npm
    # The bun musl build links libstdc++ and libgcc.
    - libgcc
    - libstdc++

# Debian installs Node from nodejs.org, since its own nodejs package is 20.x.
node:
  version: v24.21.0
  filename: node-v24.21.0-linux-x64.tar.xz
  # From https://nodejs.org/dist/v24.21.0/SHASUMS256.txt
  sha256: fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6

# npm globals, from dev-tools (cspell, claude-code) and common/prettier (prettier).
npm:
  - package: "@anthropic-ai/claude-code"
    version: "2.1.300"
    commands: [claude]
  - package: cspell
    version: "10.4.0"
    commands: [cspell]
  - package: prettier
    version: "3.9.10"
    commands: [prettier]

# Commands from the OS packages that test.nu checks. args defaults to [--version].
os_commands:
  - command: bash
  - command: curl
  - command: git
  - command: jq
  - command: node
  - command: npm
  - command: ssh
    args: [-V]
  - command: sudo

# Single-file binaries. Each entry is a release asset:
#   url       defaults to https://github.com/{repo}/releases/download/{version}/{filename}
#   sha256    of the downloaded file; a mismatch or a missing value fails the build
#   raw       true when the asset is the binary itself, saved as commands.0
#   commands  the files installed into /usr/local/bin; each must exist in the archive
#   args      version check test.nu runs per command, default [--version]
#   alpine    overrides for the Alpine image: a different asset, or `package` to install the
#             distro package instead of the release asset (version then follows the distro)
# Unless noted, versions and sha256 match devcontainer-features src/dev-shell/packages.json.
binaries:
  # Secret scanners, at the versions check-secrets.yml runs.
  - repo: mongodb/kingfisher
    version: v2.11.1
    filename: kingfisher-linux-x64.tgz
    sha256: 84e4a4c45814f05e80aa8eee768e5170d758736fa116ffaf03565da4d5a77447
    commands: [kingfisher]
